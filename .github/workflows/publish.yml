name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example, v0.11.0)
        required: true
        type: string
      expected_commit:
        description: Full 40-character commit SHA the tag must resolve to
        required: true
        type: string
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release identity
        id: identity
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          source_commit=$(git rev-parse HEAD)
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          for manifest in package.json packages/{a2a,ag-ui,core,foldkit,harness,mcp,memory,providers,repl,runtime,skills,test,transport}/package.json; do
            [[ "$(jq -r .version "$manifest")" == "$version" ]]
          done
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$DISPATCH_TAG" == "$tag" ]]
            [[ "$EXPECTED_COMMIT" == "$source_commit" ]]
          else
            [[ "$GITHUB_REF" == "refs/tags/$tag" ]]
            [[ "$GITHUB_SHA" == "$source_commit" ]]
          fi
          [[ "$(git rev-list -n1 "refs/tags/$tag^{commit}")" == "$source_commit" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" == "$source_commit" ]]
          gh auth setup-git
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release:refs/remotes/origin/release
          git merge-base --is-ancestor "$source_commit" origin/main
          git merge-base --is-ancestor "$source_commit" origin/release
          {
            echo "source_commit=$source_commit"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
      - run: git submodule update --init --recursive
      - run: bun install --frozen-lockfile
      - name: Build and verify release assets
        env:
          PACKAGE_ARTIFACT_DIR: ${{ github.workspace }}/release
        run: bun run package
      - name: Attest release assets
        if: ${{ github.event.repository.private == false || github.event.enterprise != null }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: Record unavailable GitHub attestation capability
        if: ${{ github.event.repository.private && github.event.enterprise == null }}
        shell: bash
        run: |
          echo '### GitHub artifact provenance' >> "$GITHUB_STEP_SUMMARY"
          echo 'Skipped: GitHub artifact attestations require Enterprise Cloud for private repositories; this event has no enterprise account.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release/*
          compression-level: 0
          if-no-files-found: error

  release:
    needs: produce
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release
      - name: Reconcile GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.produce.outputs.source_commit }}
          TAG: ${{ needs.produce.outputs.tag }}
          VERSION: ${{ needs.produce.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          package_assets=(
            "batonfx-a2a-${VERSION}.tgz"
            "batonfx-ag-ui-${VERSION}.tgz"
            "batonfx-core-${VERSION}.tgz"
            "batonfx-foldkit-${VERSION}.tgz"
            "batonfx-harness-${VERSION}.tgz"
            "batonfx-mcp-${VERSION}.tgz"
            "batonfx-memory-${VERSION}.tgz"
            "batonfx-providers-${VERSION}.tgz"
            "batonfx-repl-${VERSION}.tgz"
            "batonfx-runtime-${VERSION}.tgz"
            "batonfx-skills-${VERSION}.tgz"
            "batonfx-test-${VERSION}.tgz"
            "batonfx-transport-${VERSION}.tgz"
          )
          mapfile -t package_assets < <(printf '%s\n' "${package_assets[@]}" | sort)
          expected=(SHA256SUMS "${package_assets[@]}" release-evidence.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${assets[*]}" == "${expected[*]}" ]]
          mapfile -t checksum_names < <(awk '{ print $2 }' SHA256SUMS | sort)
          expected_checksums=("${package_assets[@]}" release-evidence.json)
          mapfile -t expected_checksums < <(printf '%s\n' "${expected_checksums[@]}" | sort)
          [[ "${checksum_names[*]}" == "${expected_checksums[*]}" ]]
          sha256sum --check SHA256SUMS
          jq -e --arg commit "$SOURCE_COMMIT" --arg version "$VERSION" '
            .schemaVersion == 1 and .sourceCommit == $commit and
            (.packages | length) == 13 and all(.packages[]; .version == $version)
          ' release-evidence.json >/dev/null
          mapfile -t evidence_names < <(jq -r '.packages[] | .filename' release-evidence.json | sort)
          [[ "${evidence_names[*]}" == "${package_assets[*]}" ]]
          mapfile -t expected_packages < <(printf '@batonfx/%s\n' a2a ag-ui core foldkit harness mcp memory providers repl runtime skills test transport)
          mapfile -t evidence_packages < <(jq -r '.packages[] | .name' release-evidence.json | sort)
          [[ "${evidence_packages[*]}" == "${expected_packages[*]}" ]]
          while IFS=$'\t' read -r filename digest; do
            grep -Fxq "${digest}  ${filename}" SHA256SUMS
          done < <(jq -r '.packages[] | [.filename, .sha256] | @tsv' release-evidence.json)
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$SOURCE_COMMIT" ]]

          if release_json=$(gh release view "$TAG" --json isDraft 2>/dev/null); then
            is_draft=$(jq -r .isDraft <<< "$release_json")
            if [[ "$is_draft" == true ]]; then
              gh release upload "$TAG" --clobber "${assets[@]}"
            fi
          else
            is_draft=true
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" "${assets[@]}"
          fi

          mapfile -t uploaded < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          [[ "${uploaded[*]}" == "${expected[*]}" ]]
          verify=$(mktemp -d)
          gh release download "$TAG" --dir "$verify"
          mapfile -t downloaded < <(find "$verify" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${downloaded[*]}" == "${expected[*]}" ]]
          (cd "$verify" && sha256sum --check SHA256SUMS)
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$SOURCE_COMMIT" ]]
          if [[ "$is_draft" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi

  publish:
    needs: produce
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release
      - name: Publish or verify exact npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SOURCE_COMMIT: ${{ needs.produce.outputs.source_commit }}
          VERSION: ${{ needs.produce.outputs.version }}
          NPM_PROVENANCE_SUPPORTED: ${{ github.event.repository.private == false }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          package_assets=(
            "batonfx-a2a-${VERSION}.tgz"
            "batonfx-ag-ui-${VERSION}.tgz"
            "batonfx-core-${VERSION}.tgz"
            "batonfx-foldkit-${VERSION}.tgz"
            "batonfx-harness-${VERSION}.tgz"
            "batonfx-mcp-${VERSION}.tgz"
            "batonfx-memory-${VERSION}.tgz"
            "batonfx-providers-${VERSION}.tgz"
            "batonfx-repl-${VERSION}.tgz"
            "batonfx-runtime-${VERSION}.tgz"
            "batonfx-skills-${VERSION}.tgz"
            "batonfx-test-${VERSION}.tgz"
            "batonfx-transport-${VERSION}.tgz"
          )
          mapfile -t package_assets < <(printf '%s\n' "${package_assets[@]}" | sort)
          expected=(SHA256SUMS "${package_assets[@]}" release-evidence.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${assets[*]}" == "${expected[*]}" ]]
          expected_checksums=("${package_assets[@]}" release-evidence.json)
          mapfile -t expected_checksums < <(printf '%s\n' "${expected_checksums[@]}" | sort)
          mapfile -t checksum_names < <(awk '{ print $2 }' SHA256SUMS | sort)
          [[ "${checksum_names[*]}" == "${expected_checksums[*]}" ]]
          sha256sum --check SHA256SUMS
          jq -e --arg commit "$SOURCE_COMMIT" --arg version "$VERSION" '
            .schemaVersion == 1 and .sourceCommit == $commit and
            (.packages | length) == 13 and all(.packages[]; .version == $version)
          ' release-evidence.json >/dev/null
          mapfile -t evidence_names < <(jq -r '.packages[] | .filename' release-evidence.json | sort)
          [[ "${evidence_names[*]}" == "${package_assets[*]}" ]]
          mapfile -t expected_packages < <(printf '@batonfx/%s\n' a2a ag-ui core foldkit harness mcp memory providers repl runtime skills test transport)
          mapfile -t evidence_packages < <(jq -r '.packages[] | .name' release-evidence.json | sort)
          [[ "${evidence_packages[*]}" == "${expected_packages[*]}" ]]
          while IFS=$'\t' read -r filename digest; do
            grep -Fxq "${digest}  ${filename}" SHA256SUMS
          done < <(jq -r '.packages[] | [.filename, .sha256] | @tsv' release-evidence.json)
          publish_args=(--access public)
          registry_document() {
            curl --fail --silent --show-error "https://registry.npmjs.org/${1/\//%2f}/$2" 2>/dev/null || true
          }
          latest_version=$(curl --fail --silent --show-error https://registry.npmjs.org/@batonfx%2fcore 2>/dev/null | jq -r '."dist-tags".latest // empty' || true)
          if [[ -n "$latest_version" ]] && [[ "$(printf '%s\n' "$latest_version" "$VERSION" | sort -V | tail -1)" == "$latest_version" ]] && [[ "$latest_version" != "$VERSION" ]]; then
            publish_args+=(--tag "patch-$(printf '%s' "$VERSION" | cut -d. -f1-2 | tr . -)")
          fi
          if [[ "$NPM_PROVENANCE_SUPPORTED" == true ]]; then
            publish_args+=(--provenance)
          else
            {
              echo '### npm provenance'
              echo 'Skipped: npm provenance is unavailable when publishing public packages from a private source repository.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          while IFS=$'\t' read -r package filename; do
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$filename" | base64 -w0)"
            registry_integrity=$(registry_document "$package" "$VERSION" | jq -r '.dist.integrity // empty')
            if [[ -n "$registry_integrity" ]]; then
              [[ "$registry_integrity" == "$local_integrity" ]]
              echo "$package@$VERSION already has the exact release tarball; skipping"
            else
              npm publish "$filename" "${publish_args[@]}"
            fi
          done < <(jq -r '.packages[] | [.name, .filename] | @tsv' release-evidence.json)

          while IFS=$'\t' read -r package filename; do
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$filename" | base64 -w0)"
            for attempt in {1..10}; do
              registry_json=$(registry_document "$package" "$VERSION")
              registry_version=$(jq -r '.version // empty' <<< "$registry_json")
              registry_integrity=$(jq -r '.dist.integrity // empty' <<< "$registry_json")
              if [[ "$registry_version" == "$VERSION" && "$registry_integrity" == "$local_integrity" ]]; then
                echo "$package@$VERSION verified: $registry_integrity"
                break
              fi
              [[ "$attempt" != 10 ]] || { echo "$package@$VERSION failed registry verification" >&2; exit 1; }
              sleep 6
            done
          done < <(jq -r '.packages[] | [.name, .filename] | @tsv' release-evidence.json)
