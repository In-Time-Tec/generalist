name: baton-runtime-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton
      POSTGRES_DB: baton
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 1s
      timeout: 3s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: baton
      MYSQL_DATABASE: baton
      MYSQL_USER: baton
      MYSQL_PASSWORD: baton
    ports:
      - "33306:3306"
    volumes:
      - ./mysql-test-databases.sql:/docker-entrypoint-initdb.d/10-test-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubaton", "-pbaton"]
      interval: 1s
      timeout: 3s
      retries: 60
