id: no-promise-first-platform
language: TypeScript
severity: error
message: Internal source must model this with Effect (Effect.gen/forEach/race, Clock, Random, Config, HttpClient, or Effect sleep) instead of Promise-first or raw-platform control flow.
rule:
  any:
    - pattern: async function $NAME($$$ARGS) { $$$BODY }
    - pattern: async ($$$ARGS) => $BODY
    - pattern: new Promise($$$ARGS)
    - pattern: Promise.all($$$ARGS)
    - pattern: Promise.race($$$ARGS)
    - pattern: Promise.allSettled($$$ARGS)
    - pattern: $VALUE.then($$$ARGS)
    - pattern: $VALUE.catch($$$ARGS)
    - pattern: Date.now()
    - pattern: new Date($$$ARGS)
    - pattern: Math.random()
    - pattern: fetch($$$ARGS)
    - pattern: setTimeout($$$ARGS)
    - pattern: setInterval($$$ARGS)
    - pattern: process.env
files:
  - "packages/*/src/**/*.ts"
  - "packages/*/src/**/*.tsx"
ignores:
  - "packages/mcp/src/mcp-tool-source.ts"
  - "packages/mcp/src/oauth.ts"
  - "**/dist/**"
  - "**/generated/**"
  - "repos/effect/**"
