name: tenetkit-runtime-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenetkit
      POSTGRES_PASSWORD: tenetkit
      POSTGRES_DB: tenetkit
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenetkit -d tenetkit"]
      interval: 1s
      timeout: 3s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tenetkit
      MYSQL_DATABASE: tenetkit
      MYSQL_USER: tenetkit
      MYSQL_PASSWORD: tenetkit
    ports:
      - "33306:3306"
    volumes:
      - ./mysql-test-databases.sql:/docker-entrypoint-initdb.d/10-test-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utenetkit", "-ptenetkit"]
      interval: 1s
      timeout: 3s
      retries: 60
