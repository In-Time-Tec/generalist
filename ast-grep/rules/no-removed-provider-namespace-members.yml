id: no-removed-provider-namespace-members
language: TypeScript
severity: error
message: Provider construction is Layer-only; use the provider namespace's layer constructor.
rule:
  any:
    - all:
        - any:
            - pattern: Anthropic.anthropic
            - pattern: Anthropic.anthropicClientLayerConfig
            - pattern: Anthropic.withAnthropic
            - pattern: Anthropic.withAnthropicFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { Anthropic } from "generalist/ai"
                - pattern: import * as Anthropic from "generalist/ai/anthropic"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: OpenAi.openAi
            - pattern: OpenAi.openAiClientLayerConfig
            - pattern: OpenAi.withOpenAi
            - pattern: OpenAi.withOpenAiFetch
            - pattern: OpenAi.openAiAccount
            - pattern: OpenAi.withOpenAiAccount
            - pattern: OpenAi.withOpenAiAccountFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { OpenAi } from "generalist/ai"
                - pattern: import * as OpenAi from "generalist/ai/openai"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: OpenAiCompatible.openAiCompatible
            - pattern: OpenAiCompatible.openAiCompatibleClientLayerConfig
            - pattern: OpenAiCompatible.withOpenAiCompatible
            - pattern: OpenAiCompatible.withOpenAiCompatibleFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { OpenAiCompatible } from "generalist/ai"
                - pattern: import * as OpenAiCompatible from "generalist/ai/openai-compat"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: OpenRouter.openRouter
            - pattern: OpenRouter.openRouterClientLayerConfig
            - pattern: OpenRouter.withOpenRouter
            - pattern: OpenRouter.withOpenRouterFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { OpenRouter } from "generalist/ai"
                - pattern: import * as OpenRouter from "generalist/ai/openrouter"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: Deterministic.deterministicModel
            - pattern: Deterministic.withDeterministic
            - pattern: Deterministic.withOpenAiOrDeterministic
            - pattern: Deterministic.withOpenAiOrDeterministicFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { Deterministic } from "generalist/ai"
                - pattern: import * as Deterministic from "generalist/ai/deterministic"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: Embedding.withOpenAiEmbedding
            - pattern: Embedding.withOpenAiEmbeddingFetch
            - pattern: Embedding.withOpenAiCompatibleEmbedding
            - pattern: Embedding.withOpenAiCompatibleEmbeddingFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { Embedding } from "generalist/ai"
                - pattern: import * as Embedding from "generalist/ai/embedding"
              stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: Presets.groq
            - pattern: Presets.withGroq
            - pattern: Presets.groqFetch
            - pattern: Presets.withGroqFetch
            - pattern: Presets.mistral
            - pattern: Presets.withMistral
            - pattern: Presets.mistralFetch
            - pattern: Presets.withMistralFetch
            - pattern: Presets.xai
            - pattern: Presets.withXai
            - pattern: Presets.xaiFetch
            - pattern: Presets.withXaiFetch
            - pattern: Presets.deepseek
            - pattern: Presets.withDeepseek
            - pattern: Presets.deepseekFetch
            - pattern: Presets.withDeepseekFetch
            - pattern: Presets.googleAiStudio
            - pattern: Presets.withGoogleAiStudio
            - pattern: Presets.googleAiStudioFetch
            - pattern: Presets.withGoogleAiStudioFetch
            - pattern: Presets.azureOpenAi
            - pattern: Presets.withAzureOpenAi
            - pattern: Presets.azureOpenAiFetch
            - pattern: Presets.withAzureOpenAiFetch
            - pattern: Presets.ollama
            - pattern: Presets.withOllama
            - pattern: Presets.ollamaFetch
            - pattern: Presets.withOllamaFetch
        - inside:
            kind: program
            has:
              any:
                - pattern: import { Presets } from "generalist/ai"
                - pattern: import * as Presets from "generalist/ai/presets"
              stopBy: end
            stopBy: end
    - all:
        - pattern: $NAMESPACE.$API
        - inside:
            kind: program
            has:
              any:
                - pattern: import { Anthropic as $NAMESPACE } from "generalist/ai"
                - pattern: import { OpenAi as $NAMESPACE } from "generalist/ai"
                - pattern: import { OpenAiCompatible as $NAMESPACE } from "generalist/ai"
                - pattern: import { OpenRouter as $NAMESPACE } from "generalist/ai"
                - pattern: import { Deterministic as $NAMESPACE } from "generalist/ai"
                - pattern: import { Embedding as $NAMESPACE } from "generalist/ai"
                - pattern: import { Presets as $NAMESPACE } from "generalist/ai"
                - pattern: import * as $NAMESPACE from "generalist/ai/anthropic"
                - pattern: import * as $NAMESPACE from "generalist/ai/openai"
                - pattern: import * as $NAMESPACE from "generalist/ai/openai-compat"
                - pattern: import * as $NAMESPACE from "generalist/ai/openrouter"
                - pattern: import * as $NAMESPACE from "generalist/ai/deterministic"
                - pattern: import * as $NAMESPACE from "generalist/ai/embedding"
                - pattern: import * as $NAMESPACE from "generalist/ai/presets"
              stopBy: end
            stopBy: end
constraints:
  API:
    regex: ^(anthropic|anthropicClientLayerConfig|withAnthropic|withAnthropicFetch|openAi|openAiClientLayerConfig|withOpenAi|withOpenAiFetch|openAiAccount|withOpenAiAccount|withOpenAiAccountFetch|openAiCompatible|openAiCompatibleClientLayerConfig|withOpenAiCompatible|withOpenAiCompatibleFetch|openRouter|openRouterClientLayerConfig|withOpenRouter|withOpenRouterFetch|deterministicModel|withDeterministic|withOpenAiOrDeterministic|withOpenAiOrDeterministicFetch|withOpenAiEmbedding|withOpenAiEmbeddingFetch|withOpenAiCompatibleEmbedding|withOpenAiCompatibleEmbeddingFetch|groq|withGroq|groqFetch|withGroqFetch|mistral|withMistral|mistralFetch|withMistralFetch|xai|withXai|xaiFetch|withXaiFetch|deepseek|withDeepseek|deepseekFetch|withDeepseekFetch|googleAiStudio|withGoogleAiStudio|googleAiStudioFetch|withGoogleAiStudioFetch|azureOpenAi|withAzureOpenAi|azureOpenAiFetch|withAzureOpenAiFetch|ollama|withOllama|ollamaFetch|withOllamaFetch)$
files:
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "examples/**/*.ts"
  - "examples/**/*.tsx"
  - "scripts/**/*.ts"
  - "scripts/**/*.tsx"
ignores:
  - "**/dist/**"
  - "**/coverage/**"
  - "node_modules/**"
