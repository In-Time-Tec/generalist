name: GitHub release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  produce:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.0.0
      - run: bun install --frozen-lockfile
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log(require("./package.json").version)')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for manifest in package.json packages/{core,test,skills,memory,providers,mcp,transport,foldkit}/package.json; do
            [[ "$(bun -e "console.log(require('./$manifest').version)")" == "$version" ]]
          done
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/v$version" ]]
            [[ "$(git rev-list -n1 "v$version^{commit}")" == "$GITHUB_SHA" ]]
          fi
      - name: Build and verify release assets
        env:
          PACKAGE_ARTIFACT_DIR: ${{ github.workspace }}/release
        run: bun run package
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: produce
    runs-on: ubuntu-24.04
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release
      - name: Verify and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version="${GITHUB_REF_NAME#v}"
          package_assets=(
            "batonfx-core-${version}.tgz"
            "batonfx-foldkit-${version}.tgz"
            "batonfx-mcp-${version}.tgz"
            "batonfx-memory-${version}.tgz"
            "batonfx-providers-${version}.tgz"
            "batonfx-skills-${version}.tgz"
            "batonfx-test-${version}.tgz"
            "batonfx-transport-${version}.tgz"
          )
          mapfile -t package_assets < <(printf '%s\n' "${package_assets[@]}" | sort)
          expected=(SHA256SUMS "${package_assets[@]}" release-evidence.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${assets[*]}" == "${expected[*]}" ]]
          expected_checksums=("${package_assets[@]}" release-evidence.json)
          mapfile -t expected_checksums < <(printf '%s\n' "${expected_checksums[@]}" | sort)
          mapfile -t checksum_names < <(awk '{ print $2 }' SHA256SUMS | sort)
          [[ "${checksum_names[*]}" == "${expected_checksums[*]}" ]]
          sha256sum --check SHA256SUMS
          jq -e --arg commit "$GITHUB_SHA" --arg version "$version" '
            .schemaVersion == 1 and
            .sourceCommit == $commit and
            (.packages | length) == 8 and
            all(.packages[]; .version == $version)
          ' release-evidence.json >/dev/null
          mapfile -t evidence_names < <(jq -r '.packages[] | .filename' release-evidence.json | sort)
          [[ "${evidence_names[*]}" == "${package_assets[*]}" ]]
          mapfile -t expected_packages < <(printf '@batonfx/%s\n' core foldkit mcp memory providers skills test transport)
          mapfile -t evidence_packages < <(jq -r '.packages[] | .name' release-evidence.json | sort)
          [[ "${evidence_packages[*]}" == "${expected_packages[*]}" ]]
          while IFS=$'\t' read -r filename digest; do
            grep -Fxq "${digest}  ${filename}" SHA256SUMS
          done < <(jq -r '.packages[] | [.filename, .sha256] | @tsv' release-evidence.json)
          [[ "$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)" == "$GITHUB_SHA" ]]
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/is-draft 2>/dev/null; then
            [[ "$(cat /tmp/is-draft)" == true ]] || { echo "release is already published"; exit 1; }
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${assets[@]}"
          mapfile -t uploaded < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          [[ "${uploaded[*]}" == "${expected[*]}" ]]
          verify=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$verify"
          mapfile -t downloaded < <(find "$verify" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${downloaded[*]}" == "${expected[*]}" ]]
          (cd "$verify" && sha256sum --check SHA256SUMS)
          [[ "$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)" == "$GITHUB_SHA" ]]
          gh release edit "$GITHUB_REF_NAME" --draft=false
