id: no-removed-provider-export-aliases
language: TypeScript
severity: error
message: Provider exports must not recreate a deleted construction-family name.
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            any:
              - all:
                  - kind: identifier
                  - pattern: $API
              - all:
                  - kind: type_identifier
                  - pattern: $API
            stopBy: end
        - has:
            all:
              - kind: string
              - regex: ^["']generalist/ai(?:/(?:anthropic|openai|openai-compat|openrouter|deterministic|embedding|presets))?["']$
            stopBy: end
    - all:
        - kind: export_statement
        - has:
            any:
              - all:
                  - kind: identifier
                  - pattern: $API
              - all:
                  - kind: type_identifier
                  - pattern: $API
            stopBy: end
        - has:
            all:
              - kind: string
              - regex: ^["']generalist/ai(?:/(?:anthropic|openai|openai-compat|openrouter|deterministic|embedding|presets))?["']$
            stopBy: end
    - pattern: import type { $VALUE as $API } from "generalist/ai"
    - pattern: import { type $VALUE as $API } from "generalist/ai"
    - pattern:
        context: export type { $VALUE as $API } from "generalist/ai"
        selector: export_statement
    - pattern:
        context: export { type $VALUE as $API } from "generalist/ai"
        selector: export_statement
    - pattern: import * as $API from "generalist/ai"
    - pattern: import * as $API from "generalist/ai/anthropic"
    - pattern: import * as $API from "generalist/ai/openai"
    - pattern: import * as $API from "generalist/ai/openai-compat"
    - pattern: import * as $API from "generalist/ai/openrouter"
    - pattern: import * as $API from "generalist/ai/deterministic"
    - pattern: import * as $API from "generalist/ai/embedding"
    - pattern: import * as $API from "generalist/ai/presets"
    - pattern:
        context: export * as $API from "generalist/ai"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/anthropic"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/openai"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/openai-compat"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/openrouter"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/deterministic"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/embedding"
        selector: export_statement
    - pattern:
        context: export * as $API from "generalist/ai/presets"
        selector: export_statement
    - pattern: import { $VALUE as $API } from "generalist/ai"
    - pattern: import { $VALUE as $API } from "generalist/ai/anthropic"
    - pattern: import { $VALUE as $API } from "generalist/ai/openai"
    - pattern: import { $VALUE as $API } from "generalist/ai/openai-compat"
    - pattern: import { $VALUE as $API } from "generalist/ai/openrouter"
    - pattern: import { $VALUE as $API } from "generalist/ai/deterministic"
    - pattern: import { $VALUE as $API } from "generalist/ai/embedding"
    - pattern: import { $VALUE as $API } from "generalist/ai/presets"
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/anthropic"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/openai"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/openai-compat"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/openrouter"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/deterministic"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/embedding"
        selector: export_statement
    - pattern:
        context: export { $VALUE as $API } from "generalist/ai/presets"
        selector: export_statement
constraints:
  API:
    regex: ^(anthropic|anthropicClientLayerConfig|WithAnthropicOptions|withAnthropic|withAnthropicFetch|openAi|openAiClientLayerConfig|WithOpenAiOptions|withOpenAi|withOpenAiFetch|openAiAccount|withOpenAiAccount|withOpenAiAccountFetch|openAiCompatible|openAiCompatibleClientLayerConfig|WithOpenAiCompatibleOptions|withOpenAiCompatible|withOpenAiCompatibleFetch|openRouter|openRouterClientLayerConfig|WithOpenRouterOptions|withOpenRouter|withOpenRouterFetch|deterministicModel|WithOpenAiOrDeterministicOptions|withDeterministic|withOpenAiOrDeterministic|withOpenAiOrDeterministicFetch|withOpenAiEmbedding|withOpenAiEmbeddingFetch|withOpenAiCompatibleEmbedding|withOpenAiCompatibleEmbeddingFetch|groq|withGroq|groqFetch|withGroqFetch|mistral|withMistral|mistralFetch|withMistralFetch|xai|withXai|xaiFetch|withXaiFetch|deepseek|withDeepseek|deepseekFetch|withDeepseekFetch|googleAiStudio|withGoogleAiStudio|googleAiStudioFetch|withGoogleAiStudioFetch|azureOpenAi|withAzureOpenAi|azureOpenAiFetch|withAzureOpenAiFetch|ollama|withOllama|ollamaFetch|withOllamaFetch)$
files:
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "examples/**/*.ts"
  - "examples/**/*.tsx"
  - "scripts/**/*.ts"
  - "scripts/**/*.tsx"
ignores:
  - "**/dist/**"
  - "**/coverage/**"
  - "node_modules/**"
