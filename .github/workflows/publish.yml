name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        type: string
        default: 0.1.0
      dry_run:
        description: Run publish validation without publishing or tagging
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release workflow
        run: bun run check:release

      - name: Build
        run: bun turbo build

      - name: Rewrite package manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs")

          const version = process.env.VERSION
          if (!version || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z-.]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`)
          }

          const packageDirs = [
            "packages/core",
            "packages/skills",
            "packages/memory",
            "packages/providers",
            "packages/mcp",
            "packages/transport",
            "packages/foldkit",
          ]
          const dependencySections = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]
          const root = JSON.parse(readFileSync("package.json", "utf8"))
          const catalog = root.workspaces?.catalog ?? {}

          for (const dir of packageDirs) {
            const path = `${dir}/package.json`
            const manifest = JSON.parse(readFileSync(path, "utf8"))
            manifest.version = version

            for (const section of dependencySections) {
              const dependencies = manifest[section]
              if (dependencies === undefined) continue

              for (const [name, range] of Object.entries(dependencies)) {
                if (typeof range !== "string") continue
                if (name.startsWith("@batonfx/") && range.startsWith("workspace:")) {
                  dependencies[name] = version
                  continue
                }
                if (range.startsWith("catalog:")) {
                  const catalogVersion = catalog[name]
                  if (typeof catalogVersion !== "string") {
                    throw new Error(`${path} references missing catalog dependency ${name}`)
                  }
                  dependencies[name] = catalogVersion
                }
              }
            }

            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - name: Validate publish manifests
        run: |
          if grep -R --line-number --include package.json -E '"(workspace|catalog):' packages/core packages/skills packages/memory packages/providers packages/mcp packages/transport packages/foldkit; then
            echo "workspace: or catalog: protocol remains in a publish manifest" >&2
            exit 1
          fi

      - name: Dry-run publish packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/core packages/skills packages/memory packages/providers packages/mcp packages/transport packages/foldkit; do
            echo "--- bun publish --dry-run ${pkg}"
            (cd "$pkg" && bun publish --access public --dry-run)
          done

      - name: Publish packages
        if: ${{ inputs.dry_run == false }}
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/core packages/skills packages/memory packages/providers packages/mcp packages/transport packages/foldkit; do
            echo "--- bun publish ${pkg}"
            (cd "$pkg" && bun publish --access public)
          done

      - name: Tag release
        if: ${{ inputs.dry_run == false }}
        run: |
          version="${{ inputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"
