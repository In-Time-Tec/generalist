name: Migrate Generalist rename

# One-shot migration: runs the rename on the self-hosted Mac runner where gh and
# railway are authenticated. Triggered by the push that adds it (or manually).
# Delete this file and scripts/migrate-generalist-rename.sh after it runs green.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/migrate-generalist.yml
      - scripts/migrate-generalist-rename.sh

concurrency:
  group: migrate-generalist
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run rename migration
        shell: bash
        run: bash scripts/migrate-generalist-rename.sh
