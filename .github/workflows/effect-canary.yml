name: Effect prerelease canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 */3 * *"

permissions:
  contents: read

concurrency:
  group: effect-prerelease-canary
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: generalist
          POSTGRES_PASSWORD: generalist-canary
          POSTGRES_DB: generalist
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U generalist -d generalist"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 60
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: generalist-canary
          MYSQL_DATABASE: generalist
          MYSQL_USER: generalist
          MYSQL_PASSWORD: generalist-canary
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ugeneralist -pgeneralist-canary"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 60
    env:
      GENERALIST_DATABASE_URL: postgres://generalist:generalist-canary@127.0.0.1:55432/generalist
      GENERALIST_MYSQL_URL: mysql://generalist:generalist-canary@127.0.0.1:33306/generalist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.0.0
      - name: Select the newest Effect v4 release candidate cohort
        shell: bash
        run: |
          set -euo pipefail
          current=$(jq -r '.workspaces.catalog.effect' package.json)
          candidate=$(npm view effect dist-tags.rc)
          [[ "$candidate" =~ ^4\.0\.0-rc\.[0-9]+$ ]]
          jq --arg current "$current" --arg candidate "$candidate" '
            .workspaces.catalog |= with_entries(if .value == $current then .value = $candidate else . end)
          ' package.json > package.json.next
          mv package.json.next package.json
          echo "Testing Effect cohort $candidate"
      - run: bun install
      - run: find node_modules/.bun -path '*/@effect/tsgo-linux-*/lib/tsc' -exec chmod +x {} +
      - run: bun run check
      - name: Configure MySQL test databases
        run: mysql -h 127.0.0.1 -P 33306 -uroot -pgeneralist-canary -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT ALL PRIVILEGES ON \`generalist\_%\`.* TO 'generalist'@'%'; FLUSH PRIVILEGES;"
      - run: bun run test
