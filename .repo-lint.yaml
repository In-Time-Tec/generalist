mode: strict
useGitignore: true

ignore:
  - "**/AGENTS.md"
  - "**/test/fixtures/visual/**"
  - "repos/**"

rules:
  noAncestorPrefix:
    - pattern: "apps/*/src/**/*.ts"
      root: src
    - pattern: "apps/*/test/**/*.ts"
      root: test
    - pattern: "packages/*/src/**/*.ts"
      root: src
    - pattern: "packages/*/test/**/*.ts"
      root: test

  mirror:
    - source: "apps/*/test/**/*.test.ts"
      target: "apps/*/src/**/*.ts"
      pattern: "*.test.ts -> *.ts"
      exclude:
        - "apps/*/test/**/*.tui.test.ts"
        - "apps/*/test/**/*.proc.test.ts"
    - source: "apps/*/test/**/*.tui.test.ts"
      target: "apps/*/src/**/*.ts"
      pattern: "*.tui.test.ts -> *.ts"
    - source: "apps/*/test/**/*.proc.test.ts"
      target: "apps/*/src/**/*.ts"
      pattern: "*.proc.test.ts -> *.ts"
    - source: "packages/*/test/**/*.test.ts"
      target: "packages/*/src/**/*.ts"
      pattern: "*.test.ts -> *.ts"
      exclude:
        - "packages/*/test/**/*.tui.test.ts"
        - "packages/*/test/**/*.proc.test.ts"
        # Cross-module Cloudflare harnesses (live workerd, conformance, export graphs) test no single src module
        - "packages/*/test/unstable/cloudflare/*.test.ts"
        # Cross-provider layerModel conformance exercises every provider's own module
        - "packages/*/test/ai/provider/layer-model.test.ts"
        # Memo conformance spans the public facade, Agent loop, Runtime journal, and storage drivers
        - "packages/generalist/test/memo/*.test.ts"
        # Learning acceptance spans the unstable leaf, Hooks, approvals, Runtime recovery, and storage drivers
        - "packages/generalist/test/learning/*.test.ts"
        # Artifact acceptance spans the unstable CRDT leaf, Host, Server WebSockets, Runtime forks, and storage drivers
        - "packages/generalist/test/artifact/*.test.ts"
        # RL export acceptance spans the unstable projection, Runtime journals, and deterministic model
        - "packages/generalist/test/trajectory/dag.test.ts"
        - "packages/generalist/test/trajectory/export.test.ts"
        # Capability recovery acceptance spans the unstable facade, Agent inheritance, and hosted Runtime journal
        - "packages/generalist/test/unstable/capability/runtime.test.ts"
    - source: "packages/*/test/**/*.tui.test.ts"
      target: "packages/*/src/**/*.ts"
      pattern: "*.tui.test.ts -> *.ts"
    - source: "packages/*/test/**/*.proc.test.ts"
      target: "packages/*/src/**/*.ts"
      pattern: "*.proc.test.ts -> *.ts"

  forbidNames:
    - __tests__
    - characterization
    - common
    - common.ts
    - helpers
    - helpers.ts
    - integration
    - misc
    - misc.ts
    - temp
    - temp.ts
    - tmp
    - tmp.ts
    - utils
    - utils.ts

  forbidPaths:
    - "apps/*/src/**/*.test.ts"
    - "packages/*/src/**/*.test.ts"
    # Publicly unstable Generalist modules live under src/unstable so the import boundary is enforceable.
    - "packages/generalist/src/{cloudflare,foldkit,interoperability,mcp,rivet,transport}/**"
    - "packages/generalist/src/ai/model/route.ts"
    - "packages/generalist/src/ai/provider/openai-account*.ts"
    - "packages/generalist/src/sandbox/worker-loader.ts"
    - "packages/generalist/src/testing/chaos.ts"
    - "*.contract.test.ts"
    - "*.integration.test.ts"
    - "*.live.test.ts"
    - "*.native.test.ts"
    - "*.spec.ts"
    - "*.story.test.ts"
    - "*behavior-[0-9]*.test.ts"

  match:
    - pattern: "apps/*"
      exclude:
        - "apps/proxy"
      require:
        - src
        - test
      case: kebab
    - pattern: "packages/*"
      require:
        - src
        - test
      case: kebab
    - pattern: "apps/*/src"
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "apps/*/src/**"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "apps/*/test"
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "apps/*/test/**"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "packages/*/src"
      childCase: kebab
      maxFiles: 12
      maxDirectories: 19
    - pattern: "packages/*/src/*"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
      exclude:
        - "packages/generalist/src/unstable"
    # Every publicly unstable leaf is its own directory; artifact and capability took it past the default cap.
    - pattern: "packages/generalist/src/unstable"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 13
    - pattern: "packages/*/src/*/**"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "packages/*/test"
      childCase: kebab
      maxFiles: 12
      # Artifact acceptance adds the one required public-feature test directory.
      maxDirectories: 22
    - pattern: "packages/*/test/*"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
    - pattern: "packages/*/test/*/**"
      case: kebab
      childCase: kebab
      maxFiles: 12
      maxDirectories: 12
