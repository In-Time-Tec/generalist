name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        type: string
        default: 0.1.0
      dry_run:
        description: Run publish validation without publishing or tagging
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release workflow
        run: bun run check

      - name: Rewrite package manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs")

          const version = process.env.VERSION
          if (!version || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z-.]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`)
          }

          const packageDirs = [
            "packages/core",
            "packages/test",
            "packages/skills",
            "packages/memory",
            "packages/providers",
            "packages/mcp",
            "packages/transport",
            "packages/foldkit",
          ]
          const dependencySections = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]
          const root = JSON.parse(readFileSync("package.json", "utf8"))
          const catalog = root.workspaces?.catalog ?? {}

          for (const dir of packageDirs) {
            const path = `${dir}/package.json`
            const manifest = JSON.parse(readFileSync(path, "utf8"))
            manifest.version = version

            for (const section of dependencySections) {
              const dependencies = manifest[section]
              if (dependencies === undefined) continue

              for (const [name, range] of Object.entries(dependencies)) {
                if (typeof range !== "string") continue
                if (name.startsWith("@batonfx/") && range.startsWith("workspace:")) {
                  dependencies[name] = version
                  continue
                }
                if (range.startsWith("catalog:")) {
                  const catalogVersion = catalog[name]
                  if (typeof catalogVersion !== "string") {
                    throw new Error(`${path} references missing catalog dependency ${name}`)
                  }
                  dependencies[name] = catalogVersion
                }
              }
            }

            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - name: Validate publish manifests
        run: |
          if grep -R --line-number --include package.json -E '"(workspace|catalog):' packages/core packages/test packages/skills packages/memory packages/providers packages/mcp packages/transport packages/foldkit; then
            echo "workspace: or catalog: protocol remains in a publish manifest" >&2
            exit 1
          fi

      - name: Verify repository
        run: bun run check

      - name: Verify packed packages
        env:
          PACKAGE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts
        run: bun run package:smoke

      - name: Dry-run publish verified packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in release-artifacts/core.tgz release-artifacts/test.tgz release-artifacts/skills.tgz release-artifacts/memory.tgz release-artifacts/providers.tgz release-artifacts/mcp.tgz release-artifacts/transport.tgz release-artifacts/foldkit.tgz; do
            echo "--- npm publish --dry-run ${tarball}"
            npm publish --access public --dry-run "./$tarball"
          done

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ inputs.version }}
          path: release-artifacts/*.tgz
          if-no-files-found: error

      - name: Publish verified packages
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in release-artifacts/core.tgz release-artifacts/test.tgz release-artifacts/skills.tgz release-artifacts/memory.tgz release-artifacts/providers.tgz release-artifacts/mcp.tgz release-artifacts/transport.tgz release-artifacts/foldkit.tgz; do
            echo "--- npm publish ${tarball}"
            npm publish --access public "./$tarball"
          done

      - name: Tag release
        if: ${{ inputs.dry_run == false }}
        run: |
          version="${{ inputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"
