name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun turbo build

      - name: Determine version
        id: version
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          latest="${latest#v}"
          latest="${latest:-0.0.0}"
          bump="${{ github.event.inputs.bump || 'patch' }}"
          IFS=. read -r major minor patch <<< "$latest"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            *) version="${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${version} (${bump})"

      - name: Set package versions
        run: |
          version="${{ steps.version.outputs.version }}"
          for pkg in packages/core packages/mcp; do
            jq --arg v "$version" '.version = $v' "$pkg/package.json" > "$pkg/package.json.tmp"
            mv "$pkg/package.json.tmp" "$pkg/package.json"
          done
          jq --arg v "$version" '.dependencies["@batonfx/core"] = $v' packages/mcp/package.json > packages/mcp/package.json.tmp
          mv packages/mcp/package.json.tmp packages/mcp/package.json

      - name: Publish @batonfx/core
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd packages/core && bun publish --access public

      - name: Publish @batonfx/mcp
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd packages/mcp && bun publish --access public

      - name: Tag release
        run: |
          version="${{ steps.version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"
