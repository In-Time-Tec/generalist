id: prefer-direct-named-imports
language: TypeScript
severity: hint
message: Prefer importing exported names directly. Use an alias only for a real local-name collision or provider variant that would otherwise require a wrapper/re-export.
rule:
  all:
    - kind: import_specifier
    - regex: "\\bas\\b"
files:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.ts.txt"
  - "apps/docs/src/snippets/**/*.txt"
ignores:
  - "repos/effect/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "node_modules/**"
