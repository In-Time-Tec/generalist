id: no-retired-baton-naming
language: TypeScript
severity: error
message: The retired project name is removed from Generalist. Use generalist naming for identifiers, SQL tables, and string literals.
rule:
  any:
    - kind: identifier
      regex: "(?i)baton"
    - kind: property_identifier
      regex: "(?i)baton"
    - kind: string_fragment
      regex: "(?i)baton"
    - kind: comment
      regex: "(?i)baton"
files:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.ts.txt"
  - "apps/docs/src/snippets/**/*.txt"
ignores:
  - "repos/effect/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "node_modules/**"
