id: no-bare-boundary-error-tags
language: TypeScript
severity: error
message: Boundary error tags must use @batonfx/<package>/<Name> for wire uniqueness.
rule:
  pattern: Schema.TaggedErrorClass<$$$>()($TAG, $$$ARGS)
constraints:
  TAG:
    not:
      regex: '^"@batonfx/[a-z-]+/[A-Z][A-Za-z]*"$'
files:
  - "packages/*/src/**/*.ts"
