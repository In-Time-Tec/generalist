id: no-module-path-service-tags
language: TypeScript
severity: error
message: Context.Service tags must use @batonfx/<package>/<ServiceClass> without a module path segment.
rule:
  pattern: Context.Service<$$$>()($TAG)
constraints:
  TAG:
    not:
      regex: '^"@batonfx/[a-z0-9-]+/[A-Z][A-Za-z0-9]*"$'
files:
  - "packages/*/src/**/*.ts"
