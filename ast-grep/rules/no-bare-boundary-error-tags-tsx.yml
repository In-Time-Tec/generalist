id: no-bare-boundary-error-tags-tsx
language: Tsx
severity: error
message: Boundary error tags must use @batonfx/<package>/<Name> for wire uniqueness.
rule:
  pattern: Schema.TaggedErrorClass<$$$>()($TAG, $$$ARGS)
constraints:
  TAG:
    not:
      regex: '^"@batonfx/[a-z0-9-]+/[A-Z][A-Za-z0-9]*"$'
files:
  - "packages/*/src/**/*.tsx"
