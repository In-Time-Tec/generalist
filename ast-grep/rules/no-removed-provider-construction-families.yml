id: no-removed-provider-construction-families
language: TypeScript
severity: error
message: Provider construction is Layer-only; use the provider module's layer constructor.
rule:
  any:
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/anthropic"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/anthropic"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/anthropic"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/anthropic"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/openai"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/openai"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/openai"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/openai"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/openai-compat"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/openai-compat"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/openai-compat"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/openai-compat"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/openrouter"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/openrouter"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/openrouter"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/openrouter"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/deterministic"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/deterministic"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/deterministic"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/deterministic"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/embedding"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/embedding"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/embedding"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/embedding"
        selector: export_statement
    - pattern:
        context: import { $API as $LOCAL } from "tenetkit/ai/presets"
        selector: import_statement
    - pattern:
        context: import { $API } from "tenetkit/ai/presets"
        selector: import_statement
    - pattern:
        context: export { $API as $LOCAL } from "tenetkit/ai/presets"
        selector: export_statement
    - pattern:
        context: export { $API } from "tenetkit/ai/presets"
        selector: export_statement
constraints:
  API:
    regex: ^(anthropic|anthropicClientLayerConfig|WithAnthropicOptions|withAnthropic|withAnthropicFetch|openAi|openAiClientLayerConfig|WithOpenAiOptions|withOpenAi|withOpenAiFetch|openAiAccount|withOpenAiAccount|withOpenAiAccountFetch|openAiCompatible|openAiCompatibleClientLayerConfig|WithOpenAiCompatibleOptions|withOpenAiCompatible|withOpenAiCompatibleFetch|openRouter|openRouterClientLayerConfig|WithOpenRouterOptions|withOpenRouter|withOpenRouterFetch|deterministicModel|WithOpenAiOrDeterministicOptions|withDeterministic|withOpenAiOrDeterministic|withOpenAiOrDeterministicFetch|withOpenAiEmbedding|withOpenAiEmbeddingFetch|withOpenAiCompatibleEmbedding|withOpenAiCompatibleEmbeddingFetch|groq|withGroq|groqFetch|withGroqFetch|mistral|withMistral|mistralFetch|withMistralFetch|xai|withXai|xaiFetch|withXaiFetch|deepseek|withDeepseek|deepseekFetch|withDeepseekFetch|googleAiStudio|withGoogleAiStudio|googleAiStudioFetch|withGoogleAiStudioFetch|azureOpenAi|withAzureOpenAi|azureOpenAiFetch|withAzureOpenAiFetch|ollama|withOllama|ollamaFetch|withOllamaFetch)$
files:
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "examples/**/*.ts"
  - "examples/**/*.tsx"
  - "scripts/**/*.ts"
  - "scripts/**/*.tsx"
ignores:
  - "**/dist/**"
  - "**/coverage/**"
  - "node_modules/**"
